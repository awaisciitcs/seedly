<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#EFE9DE"/>
    </radialGradient>
    
    <!-- Amber Glass Jar Gradient -->
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1F10"/>
      <stop offset="35%" stop-color="#6B3E1C"/>
      <stop offset="65%" stop-color="#844E24"/>
      <stop offset="90%" stop-color="#4E2812"/>
      <stop offset="100%" stop-color="#281308"/>
    </linearGradient>

    <!-- Matte Black Lid -->
    <linearGradient id="jarLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1C1A"/>
      <stop offset="50%" stop-color="#363A36"/>
      <stop offset="100%" stop-color="#1A1C1A"/>
    </linearGradient>

    <filter id="jarShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1B1E1C" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <circle cx="400" cy="420" r="260" fill="none" stroke="#E6DFD2" stroke-width="1" stroke-dasharray="4 6"/>

  <ellipse cx="400" cy="670" rx="170" ry="22" fill="#1C1E1B" opacity="0.14"/>
  <ellipse cx="400" cy="665" rx="120" ry="12" fill="#1C1E1B" opacity="0.18"/>

  <!-- Apothecary Amber Glass Jar -->
  <g filter="url(#jarShadow)">
    <!-- Jar Lid -->
    <rect x="290" y="210" width="220" height="52" rx="6" fill="url(#jarLid)"/>
    <line x1="290" y1="240" x2="510" y2="240" stroke="#484E48" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Jar Neck -->
    <rect x="310" y="262" width="180" height="20" fill="#2E170A"/>

    <!-- Jar Body (Heavy Amber Apothecary Glass) -->
    <rect x="250" y="280" width="300" height="360" rx="20" fill="url(#amberGlass)"/>
    <!-- Glass Highlights -->
    <line x1="270" y1="290" x2="270" y2="620" stroke="#D79E66" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="280" y1="300" x2="280" y2="610" stroke="#FFCA94" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

    <!-- Wrap-Around Apothecary Label -->
    <g transform="translate(285, 320)">
      <rect width="230" height="280" rx="4" fill="#FDFBF7" stroke="#E5DEC9" stroke-width="1"/>
      <rect x="8" y="8" width="214" height="264" rx="2" fill="none" stroke="#234B37" stroke-width="0.75" stroke-opacity="0.3"/>

      <text x="115" y="34" text-anchor="middle" font-family="'Georgia', serif" font-size="13" font-weight="bold" fill="#1C1E1B" letter-spacing="3">S E E D L Y</text>
      <text x="115" y="47" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="600" fill="#6B786E" letter-spacing="2">APOTHECARY • NORTHERN VALLEYS</text>

      <line x1="45" y1="58" x2="185" y2="58" stroke="#D8D0BE" stroke-width="0.75"/>

      <!-- Chamomile Flower Blossom Art -->
      <g transform="translate(115, 96)">
        <circle cx="0" cy="0" r="8" fill="#F2B832"/>
        <!-- White Chamomile Petals -->
        <ellipse cx="0" cy="-14" rx="3" ry="6" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="0" cy="14" rx="3" ry="6" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="-14" cy="0" rx="6" ry="3" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="14" cy="0" rx="6" ry="3" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="-10" cy="-10" rx="4" ry="4" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="10" cy="-10" rx="4" ry="4" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="-10" cy="10" rx="4" ry="4" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
        <ellipse cx="10" cy="10" rx="4" ry="4" fill="#FDFDF9" stroke="#E2DAC8" stroke-width="0.5"/>
      </g>

      <text x="115" y="152" text-anchor="middle" font-family="'Georgia', serif" font-size="15" font-weight="bold" fill="#1C1E1B">Pure Whole Flower</text>
      <text x="115" y="172" text-anchor="middle" font-family="'Georgia', serif" font-size="15" font-style="italic" fill="#234B37">Chamomile Tea</text>

      <line x1="75" y1="186" x2="155" y2="186" stroke="#234B37" stroke-width="1" stroke-opacity="0.4"/>

      <text x="115" y="204" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#3D453E" letter-spacing="1">50 G WHOLE BLOSSOMS</text>
      <text x="115" y="218" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#6B786E">GILGIT-BALTISTAN • ALPINE DRIED</text>
      <text x="115" y="230" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#6B786E">CAFFEINE-FREE • ZERO DUST / BAGS</text>

      <g transform="translate(115, 252)">
        <rect x="-60" y="-10" width="120" height="16" rx="8" fill="#F0EDE4" stroke="#D5CBB9" stroke-width="0.75"/>
        <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#234B37" letter-spacing="1">100% INTACT BLOSSOM</text>
      </g>
    </g>
  </g>

  <text x="60" y="70" font-family="sans-serif" font-size="10" font-weight="700" fill="#234B37" letter-spacing="1.5">SEEDLY BOTANICAL TEA</text>
  <text x="740" y="70" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="500" fill="#8B9189" letter-spacing="1">BATCH PK-2026-CHM</text>
  <text x="400" y="746" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8B9189" letter-spacing="1.5">UV-PROTECTIVE AMBER GLASS • AIRTIGHT PRESERVATION</text>
</svg>
