<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#EFE9DE"/>
    </radialGradient>

    <!-- Presentation Box Gradient -->
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4D39"/>
      <stop offset="100%" stop-color="#1B3325"/>
    </linearGradient>

    <linearGradient id="kraftMini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4D7C4"/>
      <stop offset="100%" stop-color="#C5B196"/>
    </linearGradient>

    <filter id="boxShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1B1E1C" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#DCD5C8" stroke-width="1"/>
  <circle cx="400" cy="420" r="260" fill="none" stroke="#E6DFD2" stroke-width="1" stroke-dasharray="4 6"/>

  <ellipse cx="400" cy="690" rx="230" ry="26" fill="#1C1E1B" opacity="0.14"/>

  <!-- Presentation Box Container -->
  <g filter="url(#boxShadow)">
    <!-- Rigid Gift Box Body -->
    <rect x="180" y="200" width="440" height="460" rx="16" fill="url(#boxBg)"/>
    <rect x="188" y="208" width="424" height="444" rx="12" fill="none" stroke="#D8C39D" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Gold Foil Header on Box Lid -->
    <text x="400" y="255" text-anchor="middle" font-family="'Georgia', serif" font-size="16" font-weight="bold" fill="#F4E8D2" letter-spacing="4">S E E D L Y</text>
    <text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#B5C4B9" letter-spacing="2">CYCLE NOURISHMENT • PHASE 1</text>

    <!-- Two Packets / Jars inside Kit Box -->
    <!-- Jar 1: Pumpkin -->
    <g transform="translate(210, 310)">
      <rect width="180" height="260" rx="8" fill="url(#kraftMini)" stroke="#B39F83" stroke-width="1"/>
      <rect x="15" y="20" width="150" height="220" rx="4" fill="#FDFBF7"/>
      <text x="90" y="55" text-anchor="middle" font-family="'Georgia', serif" font-size="11" font-weight="bold" fill="#1C1E1B">Raw Pumpkin</text>
      <text x="90" y="70" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#58635A">Seeds • 250 g</text>
      <circle cx="90" cy="115" r="22" fill="#E8EFEA"/>
      <path d="M 90 100 C 98 108, 100 120, 90 130 C 80 120, 82 108, 90 100 Z" fill="#2E4C38"/>
      <text x="90" y="175" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="600" fill="#234B37">DAYS 1 TO 14</text>
      <text x="90" y="195" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#889189">1 TABLESPOON DAILY</text>
    </g>

    <!-- Jar 2: Flax -->
    <g transform="translate(410, 310)">
      <rect width="180" height="260" rx="8" fill="url(#kraftMini)" stroke="#B39F83" stroke-width="1"/>
      <rect x="15" y="20" width="150" height="220" rx="4" fill="#FDFBF7"/>
      <text x="90" y="55" text-anchor="middle" font-family="'Georgia', serif" font-size="11" font-weight="bold" fill="#1C1E1B">Golden Flax</text>
      <text x="90" y="70" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#58635A">Seeds • 250 g</text>
      <circle cx="90" cy="115" r="22" fill="#F8F3E6"/>
      <path d="M 90 100 C 96 108, 96 118, 90 128 C 84 118, 84 108, 90 100 Z" fill="#B38634"/>
      <text x="90" y="175" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="600" fill="#234B37">DAYS 1 TO 14</text>
      <text x="90" y="195" text-anchor="middle" font-family="sans-serif" font-size="6.5" fill="#889189">1 TABLESPOON DAILY</text>
    </g>

    <!-- Botanical Measuring Scoop across bottom -->
    <g transform="translate(260, 595)">
      <rect x="0" y="6" width="280" height="12" rx="6" fill="#C9A36A"/>
      <ellipse cx="280" cy="12" rx="20" ry="14" fill="#B08A52"/>
      <text x="120" y="15" font-family="sans-serif" font-size="7" font-weight="700" fill="#694C24" letter-spacing="1">ENGRAVED 1-TBSP SCOOP INCLUDED</text>
    </g>

    <!-- Gold Foil Label Ribbon -->
    <rect x="250" y="618" width="300" height="24" rx="4" fill="#FAF6EE"/>
    <text x="400" y="634" text-anchor="middle" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="#1B3325" letter-spacing="1">FOLLICULAR PHASE RITUAL KIT • 500 G TOTAL</text>
  </g>

  <text x="60" y="70" font-family="sans-serif" font-size="10" font-weight="700" fill="#234B37" letter-spacing="1.5">SEEDLY CURATED KITS</text>
  <text x="740" y="70" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="500" fill="#8B9189" letter-spacing="1">KIT NO. 01 • PHASE 1</text>
  <text x="400" y="746" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8B9189" letter-spacing="1.5">COMPLETE BOTANICAL KIT • 2 POUCHES + MEASURING SCOOP</text>
</svg>
