<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </radialGradient>
    <linearGradient id="sageSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6753"/>
      <stop offset="100%" stop-color="#243C2E"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#heroBg)"/>
  <rect x="40" y="40" width="920" height="720" fill="none" stroke="#D8CEBE" stroke-width="1"/>
  <circle cx="500" cy="400" r="320" fill="none" stroke="#E2D9CB" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Apothecary Botanical Motif Collection in Center -->
  <g transform="translate(500, 360)">
    <!-- Decorative Center Medallion -->
    <circle cx="0" cy="0" r="160" fill="#F4EFE6" stroke="#D3C5B0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="#234B37" stroke-width="0.75" stroke-opacity="0.3"/>

    <!-- Central Botanical Branch (Flax & Chamomile) -->
    <path d="M 0 100 Q 10 20 0 -80 Q -10 -120 0 -130" fill="none" stroke="#234B37" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chamomile Top Bloom -->
    <circle cx="0" cy="-130" r="14" fill="#F5C042"/>
    <ellipse cx="0" cy="-152" rx="5" ry="10" fill="#FFFFFF" stroke="#DED5C5" stroke-width="0.75"/>
    <ellipse cx="0" cy="-108" rx="5" ry="10" fill="#FFFFFF" stroke="#DED5C5" stroke-width="0.75"/>
    <ellipse cx="-22" cy="-130" rx="10" ry="5" fill="#FFFFFF" stroke="#DED5C5" stroke-width="0.75"/>
    <ellipse cx="22" cy="-130" rx="10" ry="5" fill="#FFFFFF" stroke="#DED5C5" stroke-width="0.75"/>
    <!-- Leaves -->
    <path d="M 0 -40 C -30 -50, -40 -10, 0 10" fill="url(#sageSoft)"/>
    <path d="M 0 0 C 30 -10, 40 30, 0 50" fill="url(#sageSoft)"/>
    <path d="M 0 40 C -25 30, -35 70, 0 90" fill="url(#sageSoft)"/>

    <!-- Arching Text around Center -->
    <text x="0" y="195" text-anchor="middle" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#1C1E1B" letter-spacing="4">SEEDLY NATURALS</text>
    <text x="0" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#69766C" letter-spacing="2">PANTRY &amp; INFUSIONS • PAKISTAN EST. 2026</text>
  </g>

  <!-- Editorial Labels -->
  <text x="70" y="80" font-family="sans-serif" font-size="11" font-weight="700" fill="#234B37" letter-spacing="2">RAW PANTRY SEEDS &amp; WHOLE MOUNTAIN BLOSSOMS</text>
  <text x="930" y="80" text-anchor="end" font-family="sans-serif" font-size="10" font-weight="600" fill="#889189" letter-spacing="1.5">GILGIT • HUNZA • PUNJAB</text>
  <text x="500" y="725" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#889189" letter-spacing="2">UNCOMPROMISED BOTANICAL PURITY • COLD-MILLED &amp; SUN-DRIED</text>
</svg>
